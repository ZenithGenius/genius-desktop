-- Anonymous HUD: transparent system monitor in the boot-splash steel palette.
conky.config = {
    alignment = 'top_right', gap_x = 48, gap_y = 72,
    minimum_width = 300, maximum_width = 300,
    background = true, double_buffer = true, update_interval = 2,
    own_window = true, own_window_type = 'desktop', own_window_transparent = true, own_window_argb_visual = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    draw_shades = false, draw_outline = false, draw_borders = false, draw_graph_borders = false,
    use_xft = true, font = 'DejaVu Sans Mono:size=9',
    default_color = '6caaff', color1 = 'b07cff', color2 = '4d5d6d', color3 = '6fe3e8',
    out_to_wayland = false, out_to_x = true,
}
conky.text = [[
${color2}root@legion:~# status --live
${color2}${hr 1}
${color1}NODE     ${color}${nodename}   ${color2}up ${uptime_short}
${color1}KERNEL   ${color}${kernel}
${color2}${hr 1}
${color1}CPU      ${color}${cpu cpu0}%  ${color3}${hwmon coretemp temp 1}°C
${color3}${cpugraph cpu0 28,300 1c2731 b07cff}
${color1}RAM      ${color}${mem} / ${memmax}
${color3}${membar 4,300}
${color1}ROOT     ${color}${fs_used /} / ${fs_size /}
${color2}${hr 1}
${color1}NET      ${color}${addr IFACE}
${color1}DOWN     ${color}${downspeed IFACE}  ${color2}${downspeedgraph IFACE 14,140 1c2731 6fe3e8}
${color1}UP       ${color}${upspeed IFACE}  ${color2}${upspeedgraph IFACE 14,140 1c2731 6fe3e8}
${color2}${hr 1}
${color}Expect us.
]]
