# Anonymous steel prompt, Kali-style frame
# Two-line Kali frame, split so a window resize never eats the top line:
# the shell prints profiles.top as plain output, zsh only redraws the "└─❯" line.
add_newline = false
format = "[└─](#5a6e96)$character"

[profiles]
top = """[┌──\\(](#5a6e96)$username[㉿](#8c8cff)$hostname[\\)-\\[](#5a6e96)$directory[\\]](#5a6e96)$git_branch$git_status$python$nodejs$java$docker_context$cmd_duration${custom.vpn}$time"""

[username]
show_always = true
format = "[$user]($style)"
style_user = "bold #b07cff"
style_root = "bold #b05f6d"

[hostname]
ssh_only = false
format = "[$hostname](bold #6fe3e8)"

[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
style = "bold #6caaff"
truncation_length = 4
truncate_to_repo = false

[git_branch]
format = " [git:$branch]($style)"
style = "#8fa6bd"

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "#8b7fb3"

[python]
format = " [py $version]($style)"
style = "#6c8fb3"

[nodejs]
format = " [node $version]($style)"
style = "#6f9f8f"

[java]
format = " [java $version]($style)"
style = "#8fa6bd"

[docker_context]
format = " [docker:$context]($style)"
style = "#6c8fb3"

[cmd_duration]
min_time = 2000
format = " [took $duration]($style)"
style = "#4d5d6d"

[time]
disabled = false
format = " [$time]($style)"
time_format = "%H:%M"
style = "#4d5d6d"

[character]
success_symbol = "[❯](bold #6fe3e8)"
error_symbol = "[❯](bold #b05f6d)"

[custom.vpn]
# shown only while a VPN tunnel interface is up (NordVPN, ProtonVPN, WireGuard, OpenVPN)
when = "ip -o link show up | grep -qE ': (nordlynx|nordtun|proton[0-9]*|pvpn[^:]*|tun[0-9]+|wg[0-9]+)[:@]'"
command = "echo vpn"
format = " [● $output]($style)"
style = "bold #6fe3e8"
shell = ["sh"]
