[style.example_text]
foreground = { rgb = { r = 108, g = 170, b = 255 } }

[style.example_code]
foreground = { rgb = { r = 201, g = 212, b = 222 } }

[style.example_variable]
foreground = { rgb = { r = 176, g = 124, b = 255 } }
italic = true
