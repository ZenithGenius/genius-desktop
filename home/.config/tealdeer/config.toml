[display]
compact = false
use_pager = false

[updates]
auto_update = true
auto_update_interval_hours = 720

[style.description]
foreground = { rgb = { r = 143, g = 166, b = 189 } }

[style.command_name]
foreground = { rgb = { r = 111, g = 227, b = 232 } }
