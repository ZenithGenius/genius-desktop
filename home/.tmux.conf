# Mouse: click panes/windows, drag borders, scroll
set -g mouse on

# No Esc delay
set -sg escape-time 0

set -g set-clipboard on
bind-key          [ copy-mode
setw -g mode-keys vi
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard"

# ---- Anonymous steel theme ----
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-*:Tc,xterm-ghostty:Tc"
# Claude Code / Ghostty: passthrough + focus (needed when claude runs inside tmux)
set -g allow-passthrough on
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#0b0f13,fg=#8fa6bd"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#b07cff,fg=#0b0f13,bold] #S #[bg=#0b0f13,fg=#b07cff] "
set -g status-right "#[fg=#4d5d6d]load #[fg=#6fe3e8]#(cut -d' ' -f1 /proc/loadavg) #[fg=#4d5d6d]| #[fg=#6caaff]#(git -C #{pane_current_path} branch --show-current 2>/dev/null) #[fg=#4d5d6d]| #[fg=#c9d4de]%H:%M #[bg=#6fe3e8,fg=#0b0f13,bold] #h "
setw -g window-status-format "#[fg=#4d5d6d] #I:#W "
setw -g window-status-current-format "#[bg=#1c2731,fg=#6fe3e8,bold] #I:#W "
set -g pane-border-style "fg=#1c2731"
set -g pane-active-border-style "fg=#6fe3e8"
set -g message-style "bg=#1c2731,fg=#6fe3e8"
setw -g mode-style "bg=#2a3a52,fg=#e6edf3"
set -g display-panes-active-colour "#6fe3e8"
set -g display-panes-colour "#4d5d6d"
# easy splits that keep the current folder
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Lock after 5 idle minutes: random animation (see lockscreen); any key returns
set -g lock-after-time 300
set -g lock-command "~/.local/bin/tmux-lock"
